openapi: 3.1.0
info:
  title: FarmacoGraph API
  version: 1.0.0
  description: '**The API is the product.** FarmacoGraph never exposes Neo4j or PostgreSQL
    directly.


    Universal interface for medical education apps, simulators, flashcard generators,

    AI assistants, and third-party developers.


    ## Content Layers

    - `biomedical` — validated facts

    - `education` — pedagogical content

    - `learning` — prerequisite knowledge graph


    ## Response Modes

    - `minimal` — IDs and labels only

    - `summary` — default

    - `full` — all properties

    - `graph` — subgraph projection

    '
  license:
    name: GNU General Public License v3.0
    identifier: GPL-3.0-only
  contact:
    name: FarmacoGraph
    url: https://farmacograph.org
servers:
- url: /api/v1
  description: API v1
tags:
- name: Health
- name: Auth
- name: Dashboard
- name: Curator
- name: Drugs
- name: Entities
- name: Clinical
